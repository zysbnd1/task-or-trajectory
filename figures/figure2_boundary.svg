<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='440' viewBox='0 0 1180 440' font-family='Inter, Helvetica, Arial, sans-serif'><title>Within-task divergence</title><rect width='1180' height='440' fill='#fcfcfb'/><text x='16.0' y='26.0' font-size='15' fill='#1f1f1e' text-anchor='start' font-weight='bold'>Within a task, resolved and failed runs are equivalent at call 6 and differ clearly at the own commit point</text><text x='16.0' y='46.0' font-size='12' fill='#5f5e5a' text-anchor='start' font-weight='normal'>Boundary tasks, one resolved and one failed Gemma 4 31B run each; Q_c = forced-commit pass rate; bars: 95 % bootstrap over tasks; tasks per fork below</text><circle cx='21' cy='65' r='4.5' fill='#2a78d6'/><text x='30.0' y='69.0' font-size='11' fill='#5f5e5a' text-anchor='start' font-weight='normal'>resolved run</text><circle cx='131' cy='65' r='4.5' fill='#eb6834'/><text x='140.0' y='69.0' font-size='11' fill='#5f5e5a' text-anchor='start' font-weight='normal'>failed run, same task</text><line x1='70' y1='344.0' x2='630' y2='344.0' stroke='#e6e5e0' stroke-width='1'/><text x='62.0' y='348.0' font-size='10' fill='#5f5e5a' text-anchor='end' font-weight='normal'>0.00</text><line x1='70' y1='284.0' x2='630' y2='284.0' stroke='#e6e5e0' stroke-width='1'/><text x='62.0' y='288.0' font-size='10' fill='#5f5e5a' text-anchor='end' font-weight='normal'>0.25</text><line x1='70' y1='224.0' x2='630' y2='224.0' stroke='#e6e5e0' stroke-width='1'/><text x='62.0' y='228.0' font-size='10' fill='#5f5e5a' text-anchor='end' font-weight='normal'>0.50</text><line x1='70' y1='164.0' x2='630' y2='164.0' stroke='#e6e5e0' stroke-width='1'/><text x='62.0' y='168.0' font-size='10' fill='#5f5e5a' text-anchor='end' font-weight='normal'>0.75</text><line x1='70' y1='104.0' x2='630' y2='104.0' stroke='#e6e5e0' stroke-width='1'/><text x='62.0' y='108.0' font-size='10' fill='#5f5e5a' text-anchor='end' font-weight='normal'>1.00</text><line x1='515.3' y1='98' x2='515.3' y2='344' stroke='#5f5e5a' stroke-width='1' stroke-dasharray='3,4'/><text x='120.0' y='362.0' font-size='11' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>call 6</text><text x='120.0' y='376.0' font-size='10' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>41 tasks</text><text x='273.3' y='362.0' font-size='11' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>call 10</text><text x='273.3' y='376.0' font-size='10' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>32 tasks</text><text x='426.7' y='362.0' font-size='11' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>call 14</text><text x='426.7' y='376.0' font-size='10' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>23 tasks</text><text x='604.0' y='362.0' font-size='11' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>own commit point</text><text x='604.0' y='376.0' font-size='10' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>40 tasks, calls 1–30</text><line x1='111.0' y1='262.2' x2='111.0' y2='314.7' stroke='#2a78d6' stroke-width='2'/><circle cx='111.0' cy='289.3' r='4.5' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'><title>resolved run, call 6: 0.23 [0.12, 0.34]</title></circle><line x1='264.3' y1='226.4' x2='264.3' y2='296.5' stroke='#2a78d6' stroke-width='2'/><circle cx='264.3' cy='264.1' r='4.5' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'><title>resolved run, call 10: 0.33 [0.20, 0.49]</title></circle><line x1='417.7' y1='225.7' x2='417.7' y2='298.9' stroke='#2a78d6' stroke-width='2'/><circle cx='417.7' cy='264.1' r='4.5' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'><title>resolved run, call 14: 0.33 [0.19, 0.49]</title></circle><line x1='595.0' y1='141.9' x2='595.0' y2='204.1' stroke='#2a78d6' stroke-width='2'/><circle cx='595.0' cy='171.9' r='4.5' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'><title>resolved run, own commit point: 0.72 [0.58, 0.84]</title></circle><text x='626.0' y='175.9' font-size='11' fill='#1f1f1e' text-anchor='start' font-weight='bold'>0.72</text><line x1='129.0' y1='271.8' x2='129.0' y2='320.5' stroke='#eb6834' stroke-width='2'/><circle cx='129.0' cy='297.2' r='4.5' fill='#eb6834' stroke='#fcfcfb' stroke-width='2'><title>failed run, same task, call 6: 0.20 [0.10, 0.30]</title></circle><line x1='282.3' y1='251.6' x2='282.3' y2='311.6' stroke='#eb6834' stroke-width='2'/><circle cx='282.3' cy='281.6' r='4.5' fill='#eb6834' stroke='#fcfcfb' stroke-width='2'><title>failed run, same task, call 10: 0.26 [0.14, 0.39]</title></circle><line x1='435.7' y1='257.1' x2='435.7' y2='316.2' stroke='#eb6834' stroke-width='2'/><circle cx='435.7' cy='288.3' r='4.5' fill='#eb6834' stroke='#fcfcfb' stroke-width='2'><title>failed run, same task, call 14: 0.23 [0.12, 0.36]</title></circle><line x1='613.0' y1='252.1' x2='613.0' y2='312.1' stroke='#eb6834' stroke-width='2'/><circle cx='613.0' cy='284.0' r='4.5' fill='#eb6834' stroke='#fcfcfb' stroke-width='2'><title>failed run, same task, own commit point: 0.25 [0.13, 0.38]</title></circle><text x='626.0' y='288.0' font-size='11' fill='#1f1f1e' text-anchor='start' font-weight='bold'>0.25</text><text x='740.0' y='82.0' font-size='12' fill='#1f1f1e' text-anchor='start' font-weight='bold'>Where outcome variance lives</text><text x='740.0' y='124.0' font-size='11' fill='#5f5e5a' text-anchor='start' font-weight='normal'>Between tasks (share of all outcome variance)</text><line x1='740' y1='154' x2='1040' y2='154' stroke='#e6e5e0' stroke-width='6' stroke-linecap='round'/><text x='740.0' y='174.0' font-size='10' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>0</text><text x='890.0' y='174.0' font-size='10' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>0.5</text><text x='1040.0' y='174.0' font-size='10' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>1</text><line x1='977.0' y1='154' x2='989.0' y2='154' stroke='#5f5e5a' stroke-width='6' stroke-linecap='round'/><circle cx='983.0' cy='154' r='5' fill='#1f1f1e' stroke='#fcfcfb' stroke-width='2'><title>Between tasks (share of all outcome variance): 79–83 % (train, dev)</title></circle><text x='740.0' y='192.0' font-size='11' fill='#1f1f1e' text-anchor='start' font-weight='normal'>79–83 % (train, dev)</text><text x='740.0' y='234.0' font-size='11' fill='#5f5e5a' text-anchor='start' font-weight='normal'>Predictable from the context at the first edit (within-task share)</text><line x1='740' y1='264' x2='1040' y2='264' stroke='#e6e5e0' stroke-width='6' stroke-linecap='round'/><text x='740.0' y='284.0' font-size='10' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>0</text><text x='890.0' y='284.0' font-size='10' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>0.5</text><text x='1040.0' y='284.0' font-size='10' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>1</text><line x1='767.0' y1='264' x2='1040.0' y2='264' stroke='#5f5e5a' stroke-width='6' stroke-linecap='round' stroke-opacity='0.35'/><circle cx='806.0' cy='264' r='5' fill='#1f1f1e' stroke='#fcfcfb' stroke-width='2'><title>Predictable from the context at the first edit (within-task share): lower bound: estimate 0.22; one-sided 95 % limit 0.09</title></circle><text x='740.0' y='302.0' font-size='11' fill='#1f1f1e' text-anchor='start' font-weight='normal'>lower bound: estimate 0.22; one-sided 95 % limit 0.09</text><text x='740.0' y='316.0' font-size='10' fill='#5f5e5a' text-anchor='start' font-weight='normal'>A lower bound on predictability, not a causal share;</text><text x='740.0' y='330.0' font-size='10' fill='#5f5e5a' text-anchor='start' font-weight='normal'>the upper end is not identified.</text><text x='16.0' y='410.0' font-size='10' fill='#5f5e5a' text-anchor='start' font-weight='normal'>Equivalent at call 6 (±0.15); no difference detected at calls 10–14 (intervals reach +0.3); +0.47 [+0.28, +0.64] at the own commit point, which lies anywhere</text><text x='16.0' y='426.0' font-size='10' fill='#5f5e5a' text-anchor='start' font-weight='normal'>between calls 1 and 30 and is plotted apart. Predictable share: Cauchy–Schwarz lower bound, estimate 0.22 (0.21 bias-corrected), one-sided 95 % limit 0.09.</text></svg>
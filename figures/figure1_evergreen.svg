<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='288' viewBox='0 0 1200 288' font-family='Inter, Helvetica, Arial, sans-serif'><title>Ever-green audit across model families</title><rect width='1200' height='288' fill='#fcfcfb'/><text x='16.0' y='26.0' font-size='15' fill='#1f1f1e' text-anchor='start' font-weight='bold'>Wrong-patch runs almost never pass mid-run; most successes pass at their first edit (three model families)</text><text x='16.0' y='46.0' font-size='12' fill='#5f5e5a' text-anchor='start' font-weight='normal'>Ever-green audit: every intermediate working tree re-applied and graded against the hidden tests</text><text x='160.0' y='113.0' font-size='12' fill='#1f1f1e' text-anchor='end' font-weight='normal'>Gemma 4 31B (train)</text><text x='160.0' y='147.0' font-size='12' fill='#1f1f1e' text-anchor='end' font-weight='normal'>Gemma 4 31B (dev)</text><text x='160.0' y='181.0' font-size='12' fill='#1f1f1e' text-anchor='end' font-weight='normal'>DeepSeek V4 Pro (dev)</text><text x='160.0' y='215.0' font-size='12' fill='#1f1f1e' text-anchor='end' font-weight='normal'>Qwen3.6-27B (dev)</text><text x='170.0' y='66.0' font-size='11' fill='#5f5e5a' text-anchor='start' font-weight='normal'>Successful runs already passing</text><text x='170.0' y='80.0' font-size='11' fill='#5f5e5a' text-anchor='start' font-weight='normal'>at their first applied edit</text><line x1='170.0' y1='92' x2='170.0' y2='228' stroke='#e6e5e0' stroke-width='1'/><text x='170.0' y='244.0' font-size='10' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>0%</text><line x1='290.0' y1='92' x2='290.0' y2='228' stroke='#e6e5e0' stroke-width='1'/><text x='290.0' y='244.0' font-size='10' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>50%</text><line x1='410.0' y1='92' x2='410.0' y2='228' stroke='#e6e5e0' stroke-width='1'/><text x='410.0' y='244.0' font-size='10' fill='#5f5e5a' text-anchor='middle' font-weight='normal'>100%</text><rect x='170' y='101' width='160.8' height='16